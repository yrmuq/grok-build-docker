name: Publish dev image

on:
  push:
    branches: [dev]

jobs:
  checks:
    if: ${{ !contains(github.event.head_commit.message, 'Merge branch ''deps''') }}
    runs-on: ubuntu-latest
    concurrency:
      group: dev-checks
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Test version bump
        run: bash tests/bump-version.test.sh
      - name: Test catalogs
        run: node --test tests/i18n.test.mjs

  publish:
    needs: checks
    if: ${{ !contains(github.event.head_commit.message, 'Merge branch ''deps''') }}
    concurrency:
      group: dev-image-push
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tag: dev
      ref: ${{ github.sha }}
    secrets: inherit
