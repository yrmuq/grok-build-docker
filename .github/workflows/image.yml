name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/yrmuq/grok-build-docker:latest
            ghcr.io/yrmuq/grok-build-docker:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/yrmuq/grok-build-docker
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make the package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/users/yrmuq/packages/container/grok-build-docker" \
            -f visibility=public
